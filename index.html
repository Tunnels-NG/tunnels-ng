<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tunnels Global | Engineering the systems behind business transformation</title>
    <meta name="theme-color" content="#0D0D0E" />

    <!--
      Route-level title, description, canonical, Open Graph and Twitter tags are
      generated from src/lib/head.ts. `npm run build` prerenders every route in
      public/sitemap.xml into its own HTML file, and the head manager in
      src/components/site/SEO.tsx re-applies the same tags on navigation. Do not
      add static duplicates here: they would compete with the per-route canonical.
    -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

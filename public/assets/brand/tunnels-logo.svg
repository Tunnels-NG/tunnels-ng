<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="title desc">
  <title id="title">Tunnels</title>
  <desc id="desc">A red rounded square with a recessed circular tunnel opening in its lower-right corner, followed by the Tunnels wordmark.</desc>
  <defs>
    <linearGradient id="tunnel-depth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A90F18"/>
      <stop offset="0.52" stop-color="#650A10"/>
      <stop offset="1" stop-color="#250609"/>
    </linearGradient>
    <radialGradient id="tunnel-inner" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#3A080C"/>
      <stop offset="0.7" stop-color="#170507"/>
      <stop offset="1" stop-color="#090304"/>
    </radialGradient>
    <clipPath id="mark-clip">
      <rect x="20" y="20" width="200" height="200" rx="30"/>
    </clipPath>
  </defs>
  <rect x="20" y="20" width="200" height="200" rx="30" fill="#E52329"/>
  <g clip-path="url(#mark-clip)">
    <circle cx="178" cy="178" r="57" fill="url(#tunnel-depth)"/>
    <circle cx="178" cy="178" r="46" fill="url(#tunnel-inner)"/>
    <circle cx="178" cy="178" r="36" fill="#FFFFFF"/>
  </g>
  <text x="270" y="164" fill="#171717" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="116" font-weight="750" letter-spacing="-5">Tunnels</text>
</svg>
